[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trialpulse-ai"
version = "0.1.0"
description = "Auditable synthetic-patient trial matching and retention research workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
retrieval = ["qdrant-client[fastembed]>=1.14,<2", "sentence-transformers>=3.4,<6"]
ml = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "xgboost>=2.1,<4", "lifelines>=0.30,<1", "shap>=0.47,<1", "joblib>=1.4,<2"]
benchmark = ["ir_datasets>=0.5.11,<1"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = ["fixtures/*.txt", "fixtures/*.run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
